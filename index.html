<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#13261f" />
  <title>测测你的灵魂对应哪位中国历史人物</title>
  <style>
    :root {
      --ink: #14231d;
      --deep: #0c1c17;
      --jade: #247568;
      --jade-light: #69b8a6;
      --gold: #d8ad61;
      --paper: #f5f0e5;
      --paper-deep: #e9dfcb;
      --muted: #6d766e;
      --wine: #8e3941;
      --shadow: 0 24px 70px rgba(6, 22, 17, .18);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--deep); }
    body {
      min-width: 320px; min-height: 100vh; margin: 0; overflow-x: hidden;
      color: var(--ink); font-family: "Noto Serif SC", "Songti SC", "STSong", Georgia, serif;
      background:
        radial-gradient(circle at 10% 8%, rgba(91, 166, 144, .22), transparent 29rem),
        radial-gradient(circle at 96% 88%, rgba(183, 133, 64, .23), transparent 26rem),
        linear-gradient(135deg, #10251e 0%, #193c31 48%, #10251e 100%);
    }
    body::before, body::after { content: ""; position: fixed; pointer-events: none; z-index: 0; }
    body::before { width: 34rem; height: 34rem; top: -19rem; left: -15rem; border: 1px solid rgba(216,173,97,.23); border-radius: 50%; box-shadow: 0 0 0 2.8rem rgba(216,173,97,.04), 0 0 0 6rem rgba(216,173,97,.03); }
    body::after { width: 19rem; height: 19rem; right: -7rem; bottom: -5rem; opacity: .55; background: repeating-radial-gradient(circle, transparent 0 10px, rgba(216,173,97,.17) 11px 12px); border-radius: 50%; }
    button { font: inherit; cursor: pointer; }
    .app { position: relative; z-index: 1; width: min(100%, 920px); min-height: 100vh; margin: auto; padding: clamp(18px, 4vw, 46px) 18px 42px; display: grid; place-items: center; }
    .screen { width: 100%; display: none; animation: reveal .55s cubic-bezier(.2,.8,.2,1) both; }
    .screen.active { display: block; }
    @keyframes reveal { from { opacity: 0; transform: translateY(16px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .paper-card { position: relative; overflow: hidden; padding: clamp(26px, 6vw, 62px); border: 1px solid rgba(126, 101, 54, .35); border-radius: 28px 7px 28px 7px; background: linear-gradient(135deg, rgba(255,253,246,.98), rgba(239,230,210,.98)); box-shadow: var(--shadow); }
    .paper-card::before { content: ""; position: absolute; inset: 10px; border: 1px solid rgba(112, 103, 74, .20); border-radius: 21px 3px 21px 3px; pointer-events: none; }
    .seal { display: inline-grid; place-items: center; width: 52px; height: 52px; margin-bottom: 19px; color: #f8ecdb; background: var(--wine); border: 2px solid #f1ddbc; outline: 1px solid var(--wine); font-size: 1.15rem; font-weight: 700; letter-spacing: .12em; transform: rotate(-5deg); }
    .eyebrow { margin: 0 0 14px; color: var(--jade); font-family: ui-sans-serif, system-ui, sans-serif; font-size: .78rem; font-weight: 800; letter-spacing: .17em; }
    h1, h2, p { margin-top: 0; }
    h1 { max-width: 720px; margin-bottom: 18px; color: var(--deep); font-size: clamp(2.05rem, 6vw, 4.55rem); line-height: 1.16; letter-spacing: .035em; }
    .lead { max-width: 620px; color: #4f5b52; font-size: clamp(1rem, 2.2vw, 1.18rem); line-height: 1.9; }
    .home-grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 18px; align-items: end; margin: 35px 0 28px; }
    .promise { padding: 18px 20px; border-left: 3px solid var(--gold); background: rgba(36,117,104,.07); color: #45554c; line-height: 1.65; }
    .history-wheel { min-height: 150px; position: relative; display: grid; place-items: center; color: var(--gold); border: 1px solid rgba(36,117,104,.2); background: rgba(36,117,104,.055); }
    .history-wheel::before { content: ""; position: absolute; width: 112px; height: 112px; border: 1px solid currentColor; border-radius: 50%; box-shadow: 0 0 0 14px rgba(216,173,97,.08), 0 0 0 29px rgba(216,173,97,.045); }
    .history-wheel span { z-index: 1; color: var(--jade); font-size: 2.7rem; letter-spacing: .1em; }
    .cta, .secondary { border: 0; border-radius: 5px; min-height: 52px; padding: 0 27px; transition: transform .2s, box-shadow .2s, background .2s; }
    .cta { color: #fff8e9; background: linear-gradient(105deg, var(--jade), #1d574d); box-shadow: 0 10px 23px rgba(16,74,62,.24); font-weight: 700; letter-spacing: .08em; }
    .cta:hover { transform: translateY(-2px); box-shadow: 0 15px 28px rgba(16,74,62,.31); }
    .cta:focus-visible, .secondary:focus-visible, .option:focus-visible { outline: 3px solid rgba(216,173,97,.75); outline-offset: 3px; }
    .small-note { margin: 17px 0 0; color: var(--muted); font-family: ui-sans-serif, system-ui, sans-serif; font-size: .82rem; line-height: 1.65; }
    .quiz-shell { max-width: 760px; margin: auto; }
    .topline { display: flex; justify-content: space-between; align-items: baseline; margin: 0 2px 14px; color: #edf3e9; font-family: ui-sans-serif, system-ui, sans-serif; font-size: .84rem; letter-spacing: .08em; }
    .topline strong { color: var(--gold); font-size: 1rem; }
    .progress { height: 5px; margin-bottom: 17px; overflow: hidden; border-radius: 99px; background: rgba(255,255,255,.18); }
    .progress > i { display: block; width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--gold), #f3d493); transition: width .45s ease; }
    .question-card { min-height: 420px; padding: clamp(25px, 5vw, 46px); }
    .question-kicker { margin-bottom: 17px; color: var(--wine); font-family: ui-sans-serif, system-ui, sans-serif; font-size: .83rem; font-weight: 800; letter-spacing: .13em; }
    .question-text { max-width: 620px; margin-bottom: clamp(23px, 4vw, 34px); font-size: clamp(1.45rem, 3.8vw, 2.15rem); font-weight: 700; line-height: 1.52; }
    .options { display: grid; gap: 11px; }
    .option { width: 100%; position: relative; display: flex; align-items: center; gap: 14px; padding: 15px 16px; color: #273d32; text-align: left; border: 1px solid #d8ccb8; border-radius: 10px 3px 10px 3px; background: rgba(255,255,255,.48); font-size: clamp(.97rem, 2.4vw, 1.06rem); line-height: 1.5; transition: border-color .18s, background .18s, transform .18s; }
    .option b { flex: 0 0 28px; display: grid; place-items: center; width: 28px; height: 28px; color: var(--jade); border: 1px solid #a6b8a9; border-radius: 50%; font-family: ui-sans-serif, system-ui, sans-serif; font-size: .75rem; }
    .option:hover { transform: translateX(4px); border-color: var(--jade); background: rgba(104,183,164,.10); }
    .option.selected { border-color: var(--jade); background: rgba(54,135,115,.14); }
    .option.selected b { color: #fff; background: var(--jade); border-color: var(--jade); }
    .quiz-foot { display: flex; justify-content: space-between; align-items: center; min-height: 58px; padding: 16px 2px 0; color: rgba(245,240,229,.8); font-family: ui-sans-serif, system-ui, sans-serif; font-size: .86rem; }
    .text-btn { border: 0; color: inherit; background: transparent; text-decoration: underline; text-underline-offset: 4px; opacity: .88; }
    .next-btn { min-width: 116px; }
    .next-btn:disabled { cursor: not-allowed; opacity: .42; transform: none; box-shadow: none; }
    .result-card { max-width: 840px; margin: auto; padding: clamp(25px, 5vw, 52px); }
    .result-card::after { content: ""; position: absolute; width: 340px; height: 340px; right: -160px; top: -150px; border: 1px solid rgba(36,117,104,.17); border-radius: 50%; box-shadow: 0 0 0 18px rgba(36,117,104,.04), 0 0 0 38px rgba(36,117,104,.025); }
    .result-header { position: relative; z-index: 1; display: grid; grid-template-columns: auto 1fr; gap: 19px; align-items: center; margin-bottom: 29px; }
    .avatar { display: grid; place-items: center; width: 93px; height: 93px; color: #f7ebd7; border: 4px solid #ecd3a3; outline: 1px solid var(--wine); border-radius: 50%; background: linear-gradient(145deg, var(--wine), #572228); box-shadow: inset 0 0 0 8px rgba(255,255,255,.08); font-size: 2.65rem; font-weight: 700; }
    .result-label { margin: 0 0 7px; color: var(--jade); font-family: ui-sans-serif, system-ui, sans-serif; font-size: .78rem; font-weight: 800; letter-spacing: .15em; }
    .result-title { margin: 0; font-size: clamp(2rem, 5vw, 3.25rem); line-height: 1.1; }
    .role { display: inline-block; margin-top: 9px; padding: 4px 10px; color: #7b5522; border: 1px solid rgba(154,111,47,.35); border-radius: 99px; background: rgba(216,173,97,.12); font-family: ui-sans-serif, system-ui, sans-serif; font-size: .78rem; }
    .quote { position: relative; z-index: 1; margin: 0 0 27px; padding: 21px 22px; color: #184c41; border-left: 4px solid var(--gold); background: rgba(36,117,104,.07); font-size: clamp(1.16rem, 3vw, 1.42rem); font-weight: 700; line-height: 1.65; }
    .result-grid { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
    .result-block { min-height: 130px; padding: 19px; border: 1px solid #dfd2bd; border-radius: 12px 3px 12px 3px; background: rgba(255,255,255,.44); }
    .result-block.wide { grid-column: 1 / -1; }
    .result-block h3 { margin: 0 0 9px; color: var(--wine); font-family: ui-sans-serif, system-ui, sans-serif; font-size: .79rem; letter-spacing: .12em; }
    .result-block p { margin: 0; color: #3d5045; font-size: .99rem; line-height: 1.75; }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag { padding: 5px 10px; color: #1a6759; border: 1px solid rgba(36,117,104,.28); border-radius: 99px; background: rgba(36,117,104,.07); font-family: ui-sans-serif, system-ui, sans-serif; font-size: .83rem; }
    .result-actions { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 11px; margin-top: 24px; }
    .secondary { color: var(--jade); border: 1px solid var(--jade); background: transparent; }
    .secondary:hover { color: #fff; background: var(--jade); transform: translateY(-2px); }
    .share-tip { align-self: center; color: #6e756e; font-family: ui-sans-serif, system-ui, sans-serif; font-size: .83rem; }
    .toast { position: fixed; z-index: 5; left: 50%; bottom: 25px; padding: 12px 18px; color: white; border-radius: 99px; background: rgba(12,28,23,.93); box-shadow: 0 8px 28px rgba(0,0,0,.25); font-family: ui-sans-serif, system-ui, sans-serif; font-size: .9rem; transform: translate(-50%, 100px); opacity: 0; transition: .35s; }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    @media (max-width: 600px) { .app { padding-inline: 13px; } .paper-card { border-radius: 20px 4px 20px 4px; } .home-grid, .result-grid { grid-template-columns: 1fr; } .history-wheel { min-height: 116px; } .question-card { min-height: 0; } .result-block.wide { grid-column: auto; } .result-header { gap: 14px; } .avatar { width: 75px; height: 75px; font-size: 2.15rem; } .result-actions { display: grid; } .share-tip { text-align: center; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="app">
    <section id="home" class="screen active" aria-labelledby="home-title">
      <div class="paper-card">
        <div class="seal" aria-hidden="true">灵魂</div>
        <p class="eyebrow">40 QUESTIONS · A FUN PERSONALITY QUIZ</p>
        <h1 id="home-title">测测你的灵魂<br>对应哪位中国历史人物</h1>
        <p class="lead">不是历史考试，也不定义你的未来。跟随直觉选出更像你的日常，看看哪一位穿越千年的灵魂，和你最有共鸣。</p>
        <div class="home-grid">
          <div class="promise">从处事方式、社交模式、压力反应到小小偏好，拼出你的「气质侧写」。约 5 分钟，结果页已为分享而生。</div>
          <div class="history-wheel" aria-hidden="true"><span>问心</span></div>
        </div>
        <button id="start-btn" class="cta" type="button">启程，寻找灵魂同频者</button>
        <p class="small-note">共 40 题 · 单选 · 凭第一反应即可 · 仅供趣味娱乐</p>
      </div>
    </section>

    <section id="quiz" class="screen" aria-live="polite">
      <div class="quiz-shell">
        <div class="topline"><span>灵魂档案 · <strong id="counter">01 / 40</strong></span><span id="dimension-tip">听从你的第一反应</span></div>
        <div class="progress" aria-label="答题进度"><i id="progress-bar"></i></div>
        <div class="paper-card question-card">
          <div id="question-kicker" class="question-kicker"></div>
          <h2 id="question-text" class="question-text"></h2>
          <div id="options" class="options"></div>
        </div>
        <div class="quiz-foot"><button id="prev-btn" class="text-btn" type="button">上一题</button><button id="next-btn" class="cta next-btn" type="button" disabled>下一题</button></div>
      </div>
    </section>

    <section id="result" class="screen" aria-live="polite">
      <article class="paper-card result-card">
        <div class="result-header"><div id="result-avatar" class="avatar"></div><div><p class="result-label">你的灵魂同频者是</p><h2 id="result-title" class="result-title"></h2><span id="result-role" class="role"></span></div></div>
        <p id="result-quote" class="quote"></p>
        <div class="result-grid">
          <section class="result-block"><h3>性格关键词</h3><div id="result-tags" class="tags"></div></section>
          <section class="result-block"><h3>隐藏优势</h3><p id="result-strength"></p></section>
          <section class="result-block wide"><h3>灵魂匹配理由</h3><p id="result-reason"></p></section>
          <section class="result-block wide"><h3>趣味彩蛋</h3><p id="result-easter"></p></section>
        </div>
        <div class="result-actions"><button id="restart-btn" class="cta" type="button">再测一次</button><button id="share-btn" class="secondary" type="button">复制分享文案</button><span class="share-tip">长按或截图，分享你的灵魂档案</span></div>
      </article>
    </section>
  </main>
  <div id="toast" class="toast" role="status"></div>

  <script>
    // 七个维度：strategy 谋略、leadership 帝王格局、culture 文人气质、chivalry 侠义、poetry 感性、courage 将略、retreat 隐逸。
    const people = {
      strategy: { name: '诸葛亮', role: '谋士 · 定局之智', avatar: '亮', tags: ['冷静筹谋', '责任感强', '全局意识'], quote: '你不是没有情绪，只是总把答案准备在情绪之前。', strength: '能把一团乱麻拆成可走的步骤。关键时刻，别人会自然等你说“先这样办”。', reason: '你的选择里既有预判，也有耐心。你习惯为未来多想一步，愿意把复杂留给自己、把清晰留给伙伴。', easter: '如果朋友临时问你“怎么办”，你可能已经在脑中排好了 A、B、C 三套方案。' },
      leadership: { name: '唐太宗李世民', role: '帝王 · 开局之魄', avatar: '世', tags: ['果断担当', '识人用人', '开阔格局'], quote: '你要的从来不是赢一回，而是一起把路走得更远。', strength: '天然会把人和资源放到合适的位置，让一群人愿意朝着同一个方向使劲。', reason: '你看重结果，也在意人心。面对难题时，你愿意拍板、也愿意听不同的声音，这份担当让你很有主心骨。', easter: '你的理想团建不是做游戏，而是“各自发挥，然后把漂亮的仗打下来”。' },
      culture: { name: '苏轼', role: '文人 · 旷达之心', avatar: '轼', tags: ['豁达通透', '有趣有料', '审美在线'], quote: '人生有风雨，你却总能从雨声里听出一点诗意。', strength: '能把寻常日子过出滋味，在低潮中保留幽默和创造力，让身边的人也松一口气。', reason: '你的答案透露着好奇、包容和生活感。你并非永远乐观，而是很懂得把不可控的事，酿成自己的体验。', easter: '你大概相信：再难的日子，也值得认真吃一顿、看一次月亮。' },
      chivalry: { name: '李白', role: '侠客 · 自由之刃', avatar: '白', tags: ['率真热烈', '向往自由', '重情重义'], quote: '你心里有一把剑，也有一片装得下星河的酒。', strength: '敢于跳出既定路线。你的热情会点亮人群，也能在他人犹豫时给出“去试试看”的勇气。', reason: '你对真诚与自由格外敏感，不爱被规训成标准答案。哪怕绕点远路，也想活得痛快、爱得坦荡。', easter: '一份突如其来的旅行邀请，最容易让你把“考虑一下”变成“什么时候出发”。' },
      poetry: { name: '李清照', role: '诗人 · 玲珑之感', avatar: '清', tags: ['细腻敏锐', '情感丰沛', '韧性温柔'], quote: '你把风吹过窗棂的声音，也记成了自己的一段故事。', strength: '细节捕捉力极强，懂得体谅人未说出口的心事；温柔不是软弱，而是你深刻的感知力。', reason: '你的选择更在意感受、氛围与真心。你愿意认真对待每一份关系，也有在安静处慢慢长出的力量。', easter: '你可能有一个“只对自己有意义”的小物件，别人不懂，你却舍不得丢。' },
      courage: { name: '岳飞', role: '将领 · 守正之勇', avatar: '飞', tags: ['坚定可靠', '行动果敢', '原则清晰'], quote: '你不轻易许诺，但答应过的事，风雨也会赶到。', strength: '执行力与抗压能力很出色。越是在关键节点，你越能稳住阵脚，用行动替代空话。', reason: '你偏向直接、可靠和有原则的选择。你不一定高声表达，但会把重要的人与事，放在行动的优先级里。', easter: '你的“我来”通常不是客气话，而是一份默认会做到的承诺。' },
      retreat: { name: '陶渊明', role: '隐士 · 自在之境', avatar: '潜', tags: ['清醒自洽', '边界分明', '返璞归真'], quote: '不是躲开人间，是你知道什么才值得留在心间。', strength: '不被外界节奏轻易带跑。你能建立自己的秩序，在纷杂中保有稳定、质朴又长久的能量。', reason: '你的答案里有对内心节奏的尊重。比起热闹的标签，你更在意是否舒服、真实，以及日子能不能长出根。', easter: '对你来说，取消一场不想去的聚会，可能比抢到热门演出门票更有幸福感。' }
    };

    const questions = [
      ['周末难得空下来，你最想怎样安排？', [['提前排好轻松但充实的清单','strategy'], ['约三两好友，做件有意义的事','leadership'], ['去一家有氛围的小店慢慢坐着','culture'], ['临时起意，去没去过的地方','chivalry']]],
      ['团队项目突然卡住时，你第一反应是？', [['先梳理问题，找出关键卡点','strategy'], ['把大家召集起来，明确下一步','leadership'], ['先稳住气氛，再想新点子','culture'], ['直接上手试一个突破口','courage']]],
      ['朋友向你倾诉很难过的事，你通常会？', [['帮他分析来龙去脉和可行方案','strategy'], ['认真听完，替他守住秘密','poetry'], ['带他去做点开心的事换换心情','chivalry'], ['用朴实的陪伴让他慢慢缓过来','retreat']]],
      ['你最舒服的工作状态是？', [['掌握全局，提前安排好节奏','strategy'], ['带着一群人朝目标推进','leadership'], ['有创作空间，能做出自己的风格','culture'], ['目标明确，干脆利落地完成','courage']]],
      ['面对一条很火但你不认同的观点，你会？', [['先观察信息来源，再形成判断','strategy'], ['说出立场，也愿意听不同意见','leadership'], ['用一个有趣比喻表达自己的看法','culture'], ['不争了，保持自己的生活节奏','retreat']]],

    let current = 0;
    let answers = Array(questions.length).fill(null);
    const $ = id => document.getElementById(id);
    const screens = ['home', 'quiz', 'result'];
    function showScreen(id) { screens.forEach(s => $(s).classList.toggle('active', s === id)); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    function renderQuestion() {
      const [text, options] = questions[current];
      $('counter').textContent = `${String(current + 1).padStart(2, '0')} / ${questions.length}`;
      $('progress-bar').style.width = `${((current + 1) / questions.length) * 100}%`;
      $('question-kicker').textContent = ['日常习惯', '处事方式', '社交模式', '情绪反应', '兴趣偏好'][current % 5] + ' · 请选择更像你的答案';
      $('question-text').textContent = text;
      $('options').innerHTML = options.map(([label], index) => `<button class="option ${answers[current] === index ? 'selected' : ''}" type="button" data-index="${index}"><b>${'ABCD'[index]}</b><span>${label}</span></button>`).join('');
      $('options').querySelectorAll('.option').forEach(btn => btn.addEventListener('click', () => { answers[current] = Number(btn.dataset.index); renderQuestion(); }));
      $('prev-btn').style.visibility = current === 0 ? 'hidden' : 'visible';
      $('next-btn').disabled = answers[current] === null;
      $('next-btn').textContent = current === questions.length - 1 ? '查看结果' : '下一题';
    }
    function getResult() {
      const scores = Object.fromEntries(Object.keys(people).map(key => [key, 0]));
      answers.forEach((answer, qIndex) => { if (answer !== null) scores[questions[qIndex][1][answer][1]] += 1; });
      // 若并列，优先选择出现次数更多、且在问卷后段获得分数的维度，让结果稳定并反映近期直觉。
      const ordered = Object.entries(scores).sort((a, b) => b[1] - a[1] || tieBreak(b[0]) - tieBreak(a[0]));
      return people[ordered[0][0]];
    }
    function tieBreak(dimension) { return answers.reduce((sum, answer, index) => sum + (answer !== null && questions[index][1][answer][1] === dimension ? index + 1 : 0), 0); }
    function renderResult() {
      const person = getResult();
      $('result-avatar').textContent = person.avatar;
      $('result-title').textContent = person.name;
      $('result-role').textContent = person.role;
      $('result-quote').textContent = `“${person.quote}”`;
      $('result-tags').innerHTML = person.tags.map(tag => `<span class="tag">${tag}</span>`).join('');
      $('result-strength').textContent = person.strength;
      $('result-reason').textContent = person.reason;
      $('result-easter').textContent = person.easter;
      $('share-btn').dataset.text = `我测出了「${person.name}」型灵魂！${person.quote}\n#测测你的灵魂对应哪位中国历史人物 #趣味人格测试`;
      showScreen('result');
    }
    function toast(message) { $('toast').textContent = message; $('toast').classList.add('show'); setTimeout(() => $('toast').classList.remove('show'), 2200); }
    $('start-btn').addEventListener('click', () => { current = 0; answers = Array(questions.length).fill(null); renderQuestion(); showScreen('quiz'); });
    $('prev-btn').addEventListener('click', () => { if (current > 0) { current--; renderQuestion(); } });
    $('next-btn').addEventListener('click', () => { if (answers[current] === null) return; if (current === questions.length - 1) renderResult(); else { current++; renderQuestion(); } });
    $('restart-btn').addEventListener('click', () => { current = 0; answers = Array(questions.length).fill(null); renderQuestion(); showScreen('quiz'); });
    $('share-btn').addEventListener('click', async () => { const text = $('share-btn').dataset.text; try { await navigator.clipboard.writeText(text); toast('分享文案已复制，快去晒出结果吧'); } catch { window.prompt('复制这段分享文案：', text); } });
